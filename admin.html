<style>
:root{--bg:#13110f;--surface:#1c1916;--surface-2:#26221d;--line:#373029;--fg:#f1ece6;--muted:#a99f94;--accent:#ff8f1f;--neg:#ff8a7a;--pos:#7fd18b;--warn:#f2c46b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 Barlow,system-ui,sans-serif}
[hidden]{display:none!important}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 48px;display:grid;gap:18px}
.wrap>*{min-width:0}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px}
header img{height:34px}
h1{font:700 1.4rem/1.1 'Barlow Condensed',sans-serif;text-transform:uppercase;margin:0;letter-spacing:.01em}
h2{font:700 1.05rem 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.03em;margin:0 0 10px}
.sub{color:var(--muted);font-size:.85rem}
.right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;font:500 .85rem Barlow,sans-serif;text-decoration:none;cursor:pointer}
.pill:hover{border-color:var(--accent)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);font:600 .95rem Barlow,sans-serif;padding:10px 14px;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.count{font-family:'IBM Plex Mono',monospace;font-size:.75rem;margin-left:6px;padding:1px 7px;border-radius:999px;background:var(--surface-2)}
.count.alerta{background:var(--accent);color:#1b1714}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.cards{display:grid;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px}
.card.foco{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,143,31,.18)}
.card-h{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline}
.card-h b{font-size:1.05rem}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.9rem}
.kv span:nth-child(odd){color:var(--muted)}
.motivo{background:var(--bg);border-radius:8px;padding:10px 12px;font-size:.9rem;white-space:pre-wrap}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end}
label{display:grid;gap:5px;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
input,select,textarea{font:inherit;font-size:.95rem;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;text-transform:none;letter-spacing:0}
input.mono{font-family:'IBM Plex Mono',monospace}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.senha{display:flex;gap:6px}.senha input{flex:1;min-width:0}
.btn{font:600 .92rem Barlow,sans-serif;border:0;border-radius:8px;padding:10px 14px;cursor:pointer;background:var(--accent);color:#1b1714;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}.btn:disabled{opacity:.55;cursor:wait}
.btn.sec{background:var(--surface-2);color:var(--fg);border:1px solid var(--line)}
.btn.neg{background:transparent;color:var(--neg);border:1px solid #5a2c26}
.btn.ic{padding:9px 11px}
.acoes{display:flex;gap:8px;flex-wrap:wrap}
.msg{font-size:.9rem;margin:0;padding:10px 12px;border-radius:8px;background:#2a1714;color:var(--neg)}
.msg.ok{background:#15251a;color:var(--pos)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#15251a;color:var(--pos);border:1px solid #2c4a33;padding:10px 16px;border-radius:10px;font-weight:500;z-index:9;max-width:calc(100% - 32px)}
.toast.erro{background:#2a1714;color:var(--neg);border-color:#5a2c26}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.tw{overflow-x:auto}
.mono{font-family:'IBM Plex Mono',monospace;font-size:.85rem}
.chip{display:inline-block;font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2)}
.c-ativo,.c-Aprovada{background:#15251a;color:var(--pos)}
.c-suspenso,.c-Negada{background:#2a1714;color:var(--neg)}
.c-Pendente{background:#33270f;color:var(--warn)}
.c-admin{background:#3a2410;color:var(--accent)}
select.perfil{width:auto;padding:5px 8px;font-size:.85rem}
.vazio{color:var(--muted);text-align:center;padding:26px}
.login{max-width:380px;margin:8vh auto 0;display:grid;gap:16px}
.inline{display:grid;gap:8px;background:var(--bg);border-radius:8px;padding:12px}
.muted{color:var(--muted)}
@media (max-width:640px){.hide-sm{display:none}}
</style>
<script src="config.js"></script>
</head>

    <div><h1>Gestão de acessos</h1><div class="sub">Conciliador de Recebíveis</div></div>
    <div class="right" id="topo" hidden>
      <span class="sub" id="quem"></span>
      <a class="pill" href="./">Abrir conciliador</a>
      <button class="pill" type="button" id="b-atualizar">Atualizar</button>
      <button class="pill" type="button" id="b-sair">Sair</button>
    </div>
  </header>

  <form class="panel login" id="f-login" hidden>
    <h2 style="margin:0">Entrar como administrador</h2>
    <label>Usuário<input id="l-usuario" autocomplete="username" autocapitalize="none" required></label>
    <label>Senha<input id="l-senha" type="password" autocomplete="current-password" required></label>
    <p class="msg" id="l-msg" hidden></p>
    <button class="btn" type="submit" id="l-btn">Entrar</button>
  </form>

  <div id="painel" hidden style="display:grid;gap:16px">
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="sol" aria-selected="true">Solicitações<span class="count" id="c-sol">0</span></button>
      <button class="tab" role="tab" data-tab="usu" aria-selected="false">Usuários<span class="count" id="c-usu">0</span></button>
      <button class="tab" role="tab" data-tab="novo" aria-selected="false">Novo usuário</button>
    </nav>
    <section id="t-sol"></section>
    <section id="t-usu" hidden></section>
    <section id="t-novo" hidden></section>
  </div>
  <p class="sub" id="carregando">Carregando…</p>
</div>
<script>
(function () {
  'use strict';
  var CFG = window.CONCILIADOR_CONFIG || {}, CHAVE_SESSAO = 'c361-sessao';
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var st = { sessao: null, dados: null, tab: 'sol', foco: (location.hash.match(/sol=([\w-]+)/) || [])[1] || null, abertoNegar: null, senhaUsu: null };

  function ler() { try { return JSON.parse(localStorage.getItem(CHAVE_SESSAO) || 'null'); } catch (e) { return null; } }
  function gravar(s) { try { localStorage.setItem(CHAVE_SESSAO, JSON.stringify(s)); } catch (e) {} }
  function apagar() { try { localStorage.removeItem(CHAVE_SESSAO); } catch (e) {} }
  function api(acao, dados) {
    return fetch(CFG.api, { method: 'POST', body: JSON.stringify(Object.assign({ acao: acao, token: st.sessao && st.sessao.token }, dados || {})) })
      .then(function (r) { return r.json(); }, function () { throw new Error('Sem conexão com o servidor de acesso.'); })
      .then(function (j) { if (!j.ok) { var e = new Error(j.erro || 'Falha no servidor.'); e.sessao = j.sessao; throw e; } return j; });
  }
  function toast(t, erro) {
    var el = document.createElement('div'); el.className = 'toast' + (erro ? ' erro' : ''); el.setAttribute('role', 'status'); el.textContent = t;
    document.body.appendChild(el); setTimeout(function () { el.remove(); }, erro ? 6000 : 3500);
  }
  function senhaNova() {
    var a = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789', s = '', r = new Uint32Array(10);
    crypto.getRandomValues(r); for (var i = 0; i < 10; i++) s += a[r[i] % a.length];
    return s.slice(0, 4) + '-' + s.slice(4, 7) + '-' + s.slice(7);
  }
  function sugerirUsuario(email, nome) {
    var base = String(email || '').split('@')[0] || String(nome || '').split(' ')[0];
    base = base.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9._-]/g, '').slice(0, 26) || 'usuario';
    if (base.length < 3) base += 'usr';
    var usados = (st.dados ? st.dados.usuarios : []).map(function (u) { return u.usuario; }), s = base, n = 2;
    while (usados.indexOf(s) >= 0) s = base + n++;
    return s;
  }
  var dt = function (iso) { if (!iso) return '–'; var d = new Date(iso); return isNaN(d) ? esc(iso) : d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); };

  function mostrarLogin(m) {
    $('#carregando').hidden = true; $('#painel').hidden = true; $('#topo').hidden = true; $('#f-login').hidden = false;
    var el = $('#l-msg'); el.textContent = m || ''; el.hidden = !m; $('#l-usuario').focus();
  }
  function carregar() {
    $('#carregando').hidden = false;
    return api('admin.listar').then(function (d) {
      st.dados = d; $('#carregando').hidden = true; $('#f-login').hidden = true; $('#painel').hidden = false; $('#topo').hidden = false;
      $('#quem').textContent = st.sessao.nome + ' · ' + st.sessao.usuario + (d.cota != null ? ' · ' + d.cota + ' e-mails disponíveis hoje' : '');
      render();
    }).catch(function (e) { if (e.sessao) apagar(); mostrarLogin(e.message); });
  }

  function render() {
    var d = st.dados, pend = d.solicitacoes.filter(function (s) { return s.status === 'Pendente'; });
    $('#c-sol').textContent = pend.length; $('#c-sol').classList.toggle('alerta', pend.length > 0);
    $('#c-usu').textContent = d.usuarios.length;
    document.querySelectorAll('.tab').forEach(function (t) { t.setAttribute('aria-selected', t.dataset.tab === st.tab); });
    ['sol', 'usu', 'novo'].forEach(function (k) { $('#t-' + k).hidden = k !== st.tab; });
    renderSol(pend); renderUsu(); renderNovo();
  }

  function renderSol(pend) {
    var d = st.dados, hist = d.solicitacoes.filter(function (s) { return s.status !== 'Pendente'; });
    var focoDecidida = st.foco && hist.filter(function (s) { return s.id === st.foco; })[0];
    $('#t-sol').innerHTML =
      (focoDecidida ? '<p class="msg ok" style="margin-bottom:12px">A solicitação de ' + esc(focoDecidida.nome) + ' já foi ' + esc(focoDecidida.status.toLowerCase()) + (focoDecidida.usuario ? ' (usuário ' + esc(focoDecidida.usuario) + ')' : '') + '.</p>' : '') +
      '<h2>Pendentes</h2><div class="cards">' + (pend.map(function (s) {
        var negar = st.abertoNegar === s.id;
        return '<article class="card' + (s.id === st.foco ? ' foco' : '') + '" id="sol-' + esc(s.id) + '" data-id="' + esc(s.id) + '">' +
          '<div class="card-h"><b>' + esc(s.nome) + '</b><span class="sub">' + esc(s.email) + '</span><span class="sub" style="margin-left:auto">' + dt(s.data) + '</span></div>' +
          '<div class="kv"><span>Empresa / área</span><span>' + esc(s.empresa || '–') + '</span></div>' +
          (s.motivo ? '<div class="motivo">' + esc(s.motivo) + '</div>' : '') +
          '<div class="form">' +
            '<label>Usuário<input class="mono" data-f="usuario" value="' + esc(sugerirUsuario(s.email, s.nome)) + '" autocapitalize="none" spellcheck="false"></label>' +
            '<label>Senha<span class="senha"><input class="mono" data-f="senha" value="' + senhaNova() + '" spellcheck="false"><button class="btn sec ic" type="button" data-acao="gerar" title="Gerar outra senha" aria-label="Gerar outra senha">↻</button></span></label>' +
            '<label>Perfil<select data-f="perfil"><option value="usuario">Usuário</option><option value="admin">Administrador</option></select></label>' +
          '</div>' +
          (negar ? '<div class="inline"><label>Motivo da negativa <span class="muted" style="text-transform:none;letter-spacing:0">(opcional, vai no e-mail)</span><textarea data-f="motivo" rows="2"></textarea></label><div class="acoes"><button class="btn neg" type="button" data-acao="negar-ok">Confirmar negativa</button><button class="btn sec" type="button" data-acao="negar-cancela">Cancelar</button></div></div>' : '') +
          '<div class="acoes"><button class="btn" type="button" data-acao="aprovar">Aprovar e enviar acesso por e-mail</button>' + (negar ? '' : '<button class="btn neg" type="button" data-acao="negar">Negar</button>') + '</div>' +
        '</article>';
      }).join('') || '<div class="panel vazio">Nenhuma solicitação pendente.</div>') + '</div>' +
      (hist.length ? '<h2 style="margin-top:22px">Histórico</h2><div class="panel tw" style="padding:4px 6px"><table><thead><tr><th>Data</th><th>Nome</th><th class="hide-sm">E-mail</th><th>Status</th><th>Usuário</th><th class="hide-sm">Decidido em</th></tr></thead><tbody>' +
        hist.map(function (s) { return '<tr' + (s.id === st.foco ? ' style="outline:2px solid var(--accent)"' : '') + '><td class="mono">' + dt(s.data) + '</td><td>' + esc(s.nome) + '</td><td class="hide-sm">' + esc(s.email) + '</td><td><span class="chip c-' + esc(s.status) + '">' + esc(s.status) + '</span></td><td class="mono">' + esc(s.usuario || '–') + '</td><td class="mono hide-sm">' + dt(s.decidido) + '</td></tr>'; }).join('') +
        '</tbody></table></div>' : '');
    if (st.foco) { var c = $('#sol-' + st.foco); if (c) setTimeout(function () { c.scrollIntoView({ block: 'center', behavior: 'smooth' }); }, 50); }
  }

  function renderUsu() {
    var u = st.dados.usuarios;
    $('#t-usu').innerHTML = '<div class="panel tw" style="padding:4px 6px"><table><thead><tr><th>Usuário</th><th>Nome</th><th class="hide-sm">E-mail</th><th>Perfil</th><th>Status</th><th class="hide-sm">Último acesso</th><th></th></tr></thead><tbody>' +
      (u.map(function (x) {
        var eu = x.usuario === st.sessao.usuario, aberto = st.senhaUsu === x.usuario;
        return '<tr data-usu="' + esc(x.usuario) + '"><td class="mono">' + esc(x.usuario) + '</td><td>' + esc(x.nome) + '</td><td class="hide-sm">' + esc(x.email) + '</td>' +
          '<td>' + (eu ? '<span class="chip c-admin" title="Você não pode alterar o próprio perfil">admin</span>' : '<select class="perfil" data-perfil aria-label="Perfil de ' + esc(x.usuario) + '"><option value="usuario"' + (x.perfil !== 'admin' ? ' selected' : '') + '>Usuário</option><option value="admin"' + (x.perfil === 'admin' ? ' selected' : '') + '>Administrador</option></select>') + '</td><td><span class="chip c-' + esc(x.status) + '">' + esc(x.status) + '</span></td>' +
          '<td class="mono hide-sm">' + dt(x.acesso) + '</td><td><div class="acoes" style="justify-content:flex-end">' +
          '<button class="btn sec" type="button" data-acao="senha">Nova senha</button>' +
          (eu ? '' : x.status === 'ativo' ? '<button class="btn neg" type="button" data-acao="suspender">Suspender</button>' : '<button class="btn sec" type="button" data-acao="reativar">Reativar</button>') +
          '</div></td></tr>' +
          (aberto ? '<tr data-usu="' + esc(x.usuario) + '"><td colspan="7"><div class="inline"><div class="form"><label>Nova senha para ' + esc(x.usuario) + '<span class="senha"><input class="mono" data-f="senha" value="' + senhaNova() + '"><button class="btn sec ic" type="button" data-acao="gerar" aria-label="Gerar outra senha">↻</button></span></label>' +
            '<div class="acoes"><button class="btn" type="button" data-acao="senha-ok">Salvar e enviar para ' + esc(x.email) + '</button><button class="btn sec" type="button" data-acao="senha-cancela">Cancelar</button></div></div></div></td></tr>' : '');
      }).join('') || '<tr><td colspan="7" class="vazio">Nenhum usuário.</td></tr>') + '</tbody></table></div>' +
      '<p class="sub" style="margin-top:10px">Suspender bloqueia o acesso na hora (a pessoa sai na próxima vez que abrir o conciliador). Os dados ficam guardados na planilha "Acessos".</p>';
  }

  function renderNovo() {
    if ($('#t-novo').childElementCount) return;
    $('#t-novo').innerHTML = '<form class="panel" id="f-novo" style="display:grid;gap:14px"><h2 style="margin:0">Criar usuário sem solicitação</h2><div class="form">' +
      '<label>Nome<input data-f="nome" required></label><label>E-mail<input data-f="email" type="email" required></label>' +
      '<label>Usuário<input class="mono" data-f="usuario" required autocapitalize="none" spellcheck="false"></label>' +
      '<label>Senha<span class="senha"><input class="mono" data-f="senha" value="' + senhaNova() + '" required><button class="btn sec ic" type="button" data-acao="gerar" aria-label="Gerar outra senha">↻</button></span></label>' +
      '<label>Perfil<select data-f="perfil"><option value="usuario">Usuário</option><option value="admin">Administrador</option></select></label>' +
      '</div><div class="acoes"><button class="btn" type="submit">Criar e enviar acesso por e-mail</button></div></form>';
    $('#f-novo [data-f=email]').addEventListener('change', function (e) { var u = $('#f-novo [data-f=usuario]'); if (!u.value) u.value = sugerirUsuario(e.target.value, $('#f-novo [data-f=nome]').value); });
    $('#f-novo').addEventListener('submit', function (e) {
      e.preventDefault();
      var f = e.target, v = function (k) { return $('[data-f=' + k + ']', f).value; }, btn = $('button[type=submit]', f);
      acao(btn, 'admin.criar', { nome: v('nome'), email: v('email'), usuario: v('usuario'), senha: v('senha'), perfil: v('perfil') }, 'Usuário criado e acesso enviado para ' + v('email') + '.', function () { f.reset(); $('[data-f=senha]', f).value = senhaNova(); st.tab = 'usu'; });
    });
  }

  function acao(btn, nome, dados, ok, depois) {
    btn.disabled = true;
    return api(nome, dados).then(function () { toast(ok); if (depois) depois(); return carregar(); })
      .catch(function (e) { if (e.sessao) { apagar(); mostrarLogin(e.message); } else toast(e.message, true); })
      .then(function () { btn.disabled = false; });
  }

  document.addEventListener('click', function (e) {
    var t = e.target.closest('.tab');
    if (t) { st.tab = t.dataset.tab; render(); return; }
    var b = e.target.closest('[data-acao]'); if (!b) return;
    var a = b.dataset.acao, card = b.closest('[data-id]'), row = b.closest('[data-usu]');
    var campo = function (k) { var el = (card || b.closest('.inline') || b.closest('form') || document).querySelector('[data-f=' + k + ']'); return el ? el.value : ''; };
    if (a === 'gerar') { b.closest('.senha').querySelector('input').value = senhaNova(); return; }
    if (card) {
      var id = card.dataset.id;
      if (a === 'aprovar') return acao(b, 'admin.aprovar', { id: id, usuario: campo('usuario'), senha: campo('senha'), perfil: campo('perfil') }, 'Acesso aprovado e enviado por e-mail.', function () { st.foco = null; });
      if (a === 'negar') { st.abertoNegar = id; renderSol(st.dados.solicitacoes.filter(function (s) { return s.status === 'Pendente'; })); return; }
      if (a === 'negar-cancela') { st.abertoNegar = null; render(); return; }
      if (a === 'negar-ok') return acao(b, 'admin.negar', { id: id, motivo: campo('motivo') }, 'Solicitação negada. A pessoa foi avisada por e-mail.', function () { st.abertoNegar = null; st.foco = null; });
    }
    if (row) {
      var u = row.dataset.usu;
      if (a === 'senha') { st.senhaUsu = u; renderUsu(); return; }
      if (a === 'senha-cancela') { st.senhaUsu = null; renderUsu(); return; }
      if (a === 'senha-ok') return acao(b, 'admin.senha', { usuario: u, senha: b.closest('.inline').querySelector('[data-f=senha]').value }, 'Nova senha salva e enviada por e-mail.', function () { st.senhaUsu = null; });
      if (a === 'suspender') return acao(b, 'admin.status', { usuario: u, status: 'suspenso' }, 'Acesso de ' + u + ' suspenso.');
      if (a === 'reativar') return acao(b, 'admin.status', { usuario: u, status: 'ativo' }, 'Acesso de ' + u + ' reativado.');
    }
  });

  document.addEventListener('change', function (e) {
    var sel = e.target.closest('select[data-perfil]'); if (!sel) return;
    var u = sel.closest('[data-usu]').dataset.usu, novo = sel.value;
    acao(sel, 'admin.perfil', { usuario: u, perfil: novo }, u + ' agora é ' + (novo === 'admin' ? 'administrador' : 'usuário') + '.')
      .then(function () { var x = (st.dados.usuarios || []).filter(function (y) { return y.usuario === u; })[0]; if (x && x.perfil !== novo) renderUsu(); });
  });
  $('#f-login').addEventListener('submit', function (e) {
    e.preventDefault(); var btn = $('#l-btn'); btn.disabled = true; $('#l-msg').hidden = true;
    api('login', { usuario: $('#l-usuario').value, senha: $('#l-senha').value }).then(function (r) {
      if (r.perfil !== 'admin') throw new Error('Este usuário não é administrador.');
      st.sessao = { token: r.token, nome: r.nome, usuario: r.usuario, perfil: r.perfil }; gravar(st.sessao); return carregar();
    }).catch(function (err) { mostrarLogin(err.message); }).then(function () { btn.disabled = false; });
  });
  $('#b-sair').onclick = function () { apagar(); st.sessao = null; mostrarLogin(''); };
  $('#b-atualizar').onclick = function () { carregar(); };

  if (!CFG.api || /COLE_AQUI/.test(CFG.api)) { mostrarLogin('Site ainda não configurado: informe a URL do Apps Script no arquivo config.js.'); return; }
  st.sessao = ler();
  if (st.sessao && st.sessao.token && st.sessao.perfil === 'admin') carregar(); else mostrarLogin(st.foco ? 'Entre como administrador para analisar a solicitação.' : '');
})();
</script>
</body>
</html>

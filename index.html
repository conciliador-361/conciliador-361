<style>
:root{--bg:#13110f;--surface:#1c1916;--line:#373029;--fg:#f1ece6;--muted:#a99f94;--accent:#ff8f1f;--neg:#ff8a7a;--pos:#7fd18b}
*{box-sizing:border-box}html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 Barlow,system-ui,sans-serif;display:grid;place-items:center;padding:24px 16px;min-height:100vh}
[hidden]{display:none!important}
main{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 24px;display:grid;gap:18px}
.logo{display:flex;align-items:center;gap:12px}.logo img{height:38px;width:auto}
h1{font:700 1.45rem/1.1 'Barlow Condensed',sans-serif;letter-spacing:.01em;margin:0;text-transform:uppercase}
.sub{color:var(--muted);font-size:.85rem;margin-top:2px}
form{display:grid;gap:14px}
label{display:grid;gap:6px;font-size:.76rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
label small{text-transform:none;letter-spacing:0;font-size:.78rem}
input,textarea{font:inherit;font-size:1rem;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:11px 12px;text-transform:none;letter-spacing:0;width:100%}
textarea{min-height:80px;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
button{font:600 1rem Barlow,sans-serif;background:var(--accent);color:#1b1714;border:0;border-radius:8px;padding:12px;cursor:pointer}
button:hover{filter:brightness(1.08)}button:disabled{opacity:.6;cursor:wait}
.link{background:none;color:var(--accent);padding:0;font-weight:500;font-size:.92rem;justify-self:center}
.link:hover{text-decoration:underline;filter:none}
.msg{font-size:.9rem;margin:0;padding:10px 12px;border-radius:8px;background:#2a1714;color:var(--neg)}
.msg.ok{background:#15251a;color:var(--pos)}
.rod{color:var(--muted);font-size:.75rem;text-align:center}
.carregando{display:grid;place-items:center;gap:14px;color:var(--muted);padding:12px 0}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:g 1s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
</style>
<script src="config.js"></script>
</head>

  <div id="v-carregando" class="carregando"><div class="spin" aria-hidden="true"></div><span id="carregando-txt">Verificando acesso…</span></div>

  <form id="f-login" hidden autocomplete="on">
    <label>Usuário<input name="usuario" id="l-usuario" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
    <label>Senha<input name="senha" id="l-senha" type="password" autocomplete="current-password" required></label>
    <p class="msg" id="l-msg" role="alert" hidden></p>
    <button type="submit" id="l-btn">Entrar</button>
    <button type="button" class="link" data-ir="solicitar">Não tem acesso? Solicitar</button>
  </form>

  <form id="f-solicitar" hidden>
    <label>Nome completo<input name="nome" required maxlength="80" autocomplete="name"></label>
    <label>E-mail<input name="email" type="email" required maxlength="120" autocomplete="email"></label>
    <label>Empresa / área<input name="empresa" maxlength="80" autocomplete="organization"></label>
    <label>Motivo do acesso <small>(opcional)</small><textarea name="motivo" maxlength="500"></textarea></label>
    <p class="msg" id="s-msg" role="alert" hidden></p>
    <button type="submit" id="s-btn">Enviar solicitação</button>
    <button type="button" class="link" data-ir="login">Já tenho acesso · Entrar</button>
  </form>

  <div id="v-enviado" hidden style="display:grid;gap:14px">
    <p class="msg ok">Pedido enviado! Você vai receber a resposta no e-mail informado.</p>
    <button type="button" class="link" data-ir="login">Voltar para o login</button>
  </div>

  <div class="rod">Os arquivos carregados continuam só no seu navegador.</div>
</main>
<script>
(function () {
  'use strict';
  var CFG = window.CONCILIADOR_CONFIG || {};
  var CHAVE_SESSAO = 'c361-sessao';
  var $ = function (s) { return document.querySelector(s); };

  function ler() { try { return JSON.parse(localStorage.getItem(CHAVE_SESSAO) || 'null'); } catch (e) { return null; } }
  function gravar(s) { try { localStorage.setItem(CHAVE_SESSAO, JSON.stringify(s)); } catch (e) {} }
  function apagar() { try { localStorage.removeItem(CHAVE_SESSAO); } catch (e) {} }

  function api(acao, dados) {
    var corpo = Object.assign({ acao: acao }, dados || {});
    return fetch(CFG.api, { method: 'POST', body: JSON.stringify(corpo) })
      .then(function (r) { return r.json(); }, function () { throw new Error('Sem conexão com o servidor de acesso. Confira a internet e tente de novo.'); })
      .then(function (j) { if (!j.ok) { var e = new Error(j.erro || 'Falha no servidor.'); e.sessao = j.sessao; throw e; } return j; });
  }

  function tela(qual, sub) {
    ['v-carregando', 'f-login', 'f-solicitar', 'v-enviado'].forEach(function (id) { $('#' + id).hidden = id !== qual; });
    $('#sub').textContent = sub || 'Acesso restrito';
    var f = $('#' + qual).querySelector('input'); if (f) f.focus();
  }
  function msg(el, txt) { el.textContent = txt || ''; el.hidden = !txt; }

  function b64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }

  /** Baixa o conciliador criptografado, abre com a chave da sessão e troca a página por ele. */
  function abrirApp(chave, sessao) {
    tela('v-carregando'); $('#carregando-txt').textContent = 'Abrindo o conciliador…';
    var pacote;
    return fetch('app.enc', { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw new Error('Arquivo app.enc não encontrado no site.'); return r.json(); })
      .then(function (p) { pacote = p; return crypto.subtle.importKey('raw', b64(chave), 'AES-GCM', false, ['decrypt']); })
      .then(function (k) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(pacote.iv) }, k, b64(pacote.dados)); })
      .then(function (buf) { return new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).text(); })
      .then(function (html) {
        window.__c361 = { nome: sessao.nome, usuario: sessao.usuario, perfil: sessao.perfil, api: CFG.api, chaveSessao: CHAVE_SESSAO };
        document.open(); document.write(html); document.close();
      })
      .catch(function (e) {
        tela('f-login'); msg($('#l-msg'), e && e.name === 'OperationError' ? 'Não foi possível abrir o conciliador: a chave não confere com a versão publicada. Avise o administrador.' : (e.message || 'Erro ao abrir o conciliador.'));
      });
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-ir]'); if (!b) return;
    var ir = b.dataset.ir;
    if (ir === 'solicitar') tela('f-solicitar', 'Solicitar acesso'); else tela('f-login');
  });

  $('#f-login').addEventListener('submit', function (e) {
    e.preventDefault();
    var btn = $('#l-btn'); btn.disabled = true; msg($('#l-msg'), '');
    api('login', { usuario: $('#l-usuario').value, senha: $('#l-senha').value })
      .then(function (r) {
        var s = { token: r.token, nome: r.nome, usuario: r.usuario, perfil: r.perfil };
        gravar(s);
        if (location.hash === '#admin' && r.perfil === 'admin') { location.href = 'admin.html'; return; }
        return abrirApp(r.chave, s);
      })
      .catch(function (err) { msg($('#l-msg'), err.message); $('#l-senha').select(); })
      .then(function () { btn.disabled = false; });
  });

  $('#f-solicitar').addEventListener('submit', function (e) {
    e.preventDefault();
    var f = e.target, btn = $('#s-btn'); btn.disabled = true; msg($('#s-msg'), '');
    api('solicitar', { nome: f.nome.value, email: f.email.value, empresa: f.empresa.value, motivo: f.motivo.value })
      .then(function () { f.reset(); tela('v-enviado', 'Solicitar acesso'); })
      .catch(function (err) { msg($('#s-msg'), err.message); })
      .then(function () { btn.disabled = false; });
  });

  // início
  if (!CFG.api || /COLE_AQUI/.test(CFG.api)) {
    tela('f-login'); msg($('#l-msg'), 'Site ainda não configurado: informe a URL do Apps Script no arquivo config.js.'); $('#l-btn').disabled = true; return;
  }
  if (location.hash === '#solicitar') { tela('f-solicitar', 'Solicitar acesso'); return; }
  var s = ler();
  if (!s || !s.token) { tela('f-login'); return; }
  api('abrir', { token: s.token })
    .then(function (r) { s.nome = r.nome; s.perfil = r.perfil; s.usuario = r.usuario; gravar(s); return abrirApp(r.chave, s); })
    .catch(function (err) { if (err.sessao) apagar(); tela('f-login'); msg($('#l-msg'), err.message); if (s.usuario) $('#l-usuario').value = s.usuario; });
})();
</script>
